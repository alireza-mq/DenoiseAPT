[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "denoiseapt-demo"
version = "0.2.1"
description = "Interactive anomaly-preserving generative time-series denoising research demo"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.3,<3",
]

[tool.setuptools.packages.find]
include = ["denoiseapt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: end-to-end protocol tests that train compact neural models",
]
